name: GitHub Metrics

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate top metrics
        uses: lowlighter/metrics@latest
        with:
          filename: top.svg
          token: ${{ secrets.METRICS }}
          committer_token: ${{ secrets.METRICS }}

          user: Chintanpatel24
          template: classic
          base: header, activity, community, repositories, metadata

          config_display: large
          config_padding: 0, 3%
          config_timezone: Asia/Kolkata

          plugin_people: yes
          plugin_people_types: followers

          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

          plugin_lines: yes

          plugin_topics: yes
          plugin_topics_limit: 0
          plugin_topics_mode: icons

          plugin_languages: yes
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          plugin_stars: yes
          plugin_stars_limit: 8

      - name: Generate middle metrics
        uses: lowlighter/metrics@latest
        with:
          filename: midd.svg
          token: ${{ secrets.METRICS }}
          committer_token: ${{ secrets.METRICS }}

          user: Chintanpatel24
          base: ""

          # =============================================
          # Languages from your starred repos
          # =============================================
          plugin_languages: yes
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_other: yes

          # =============================================
          # Licenses overview of your repos
          # =============================================
          plugin_licenses: yes
          plugin_licenses_setup: yes
          plugin_licenses_ratio: yes
          plugin_licenses_legal: yes

      - name: Generate bottom metrics
        uses: lowlighter/metrics@latest
        with:
          filename: bottom.svg
          token: ${{ secrets.METRICS }}
          committer_token: ${{ secrets.METRICS }}

          user: Chintanpatel24
          base: ""

          plugin_followup: yes
          plugin_followup_sections: repositories

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
